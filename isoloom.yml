# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# tiramisu (Google's 2021 security competition, by Google; a crypto challenge) as an Isoloom spec:
# an ECDH secure channel over a protobuf protocol that lets the client name the curve of its point.
# The challenge folder 2021/quals/crypto-tiramisu of Google's challenge archive is vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2021-tiramisu

networks:
  lab: { cidr: 10.60.183.0/24, internet: false }

machines:
  challenge:
    networks: { lab: 10 }
    services: [{ port: 1337, name: challenge, publish: 1337 }]
    resources: { cpus: 1, memory_mb: 512 }
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    docker:
      build: app/challenge

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the server sends its handshake message
    script: checks/probe.sh
    wait: 60

message: |
  tiramisu (Google, 2021) answers at `nc localhost {{ machines.challenge.services.0.publish }}`.
  You name the curve of your point; the server's key lives on another one. What does that do to the shared secret?
